<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint so dark mode never flashes light.
			(() => {
				let theme = 'light';
				try {
					theme = localStorage.getItem('nycu-life-theme') === 'dark' ? 'dark' : 'light';
				} catch {
					/* localStorage unavailable: default to light */
				}
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<style>
			/* Boot splash: a solid theme-coloured backdrop and the wordmark until the hero
			   art has decoded, so visitors never see half-loaded artwork. Removed by the app. */
			html {
				background: #f4f6fb;
			}
			html[data-theme='dark'] {
				background: #0b1220;
			}
			#boot-splash {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: grid;
				place-items: center;
				background: #f4f6fb;
				pointer-events: none;
				transition: opacity 0.35s ease;
			}
			html[data-theme='dark'] #boot-splash {
				background: #0b1220;
			}
			#boot-splash img {
				width: clamp(9rem, 28vw, 13rem);
				height: auto;
				opacity: 0.9;
			}
			#boot-splash .splash-dark,
			html[data-theme='dark'] #boot-splash .splash-light {
				display: none;
			}
			html[data-theme='dark'] #boot-splash .splash-dark {
				display: block;
			}
			#boot-splash.done {
				opacity: 0;
			}
		</style>
		<script>
			(() => {
				let wheelIntent = 0;
				let touchStartY = 0;
				let touchStartedInStory = false;
				let intent = 0;

				const motionIsEnabled = () =>
					new URLSearchParams(window.location.search).get('motion') === 'on' ||
					!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				const storyIsEngaged = () => {
					const story = document.querySelector('.scroll-story');
					if (!story || !motionIsEnabled()) return false;
					const rect = story.getBoundingClientRect();
					const topBarBottom =
						document.querySelector('.topbar')?.getBoundingClientRect().bottom ?? 0;
					return rect.top <= topBarBottom + 3 && rect.bottom >= window.innerHeight - 3;
				};
				const onWheel = (event) => {
					if (!storyIsEngaged()) return;
					const multiplier =
						event.deltaMode === WheelEvent.DOM_DELTA_LINE
							? 16
							: event.deltaMode === WheelEvent.DOM_DELTA_PAGE
								? window.innerHeight
								: 1;
					const delta = event.deltaY * multiplier;
					if (delta <= 0) return;
					event.preventDefault();
					wheelIntent += delta;
					if (wheelIntent >= 32) intent = 1;
				};
				const onTouchStart = (event) => {
					const story = document.querySelector('.scroll-story');
					touchStartedInStory = Boolean(story && event.target && story.contains(event.target));
					touchStartY = event.touches[0]?.clientY ?? 0;
				};
				const onTouchMove = (event) => {
					if (!touchStartedInStory || !storyIsEngaged()) return;
					const currentY = event.touches[0]?.clientY;
					if (currentY === undefined) return;
					const distance = touchStartY - currentY;
					if (distance <= 0) return;
					event.preventDefault();
					if (distance >= 28) intent = 1;
				};
				const onTouchEnd = () => {
					touchStartedInStory = false;
				};
				const cleanup = () => {
					window.removeEventListener('wheel', onWheel, true);
					window.removeEventListener('touchstart', onTouchStart, true);
					window.removeEventListener('touchmove', onTouchMove, true);
					window.removeEventListener('touchend', onTouchEnd, true);
					window.removeEventListener('touchcancel', onTouchEnd, true);
				};

				window.__nycuStoryBootstrap = {
					consume() {
						const bufferedIntent = intent;
						intent = 0;
						return bufferedIntent;
					},
					cleanup
				};
				window.addEventListener('wheel', onWheel, { passive: false, capture: true });
				window.addEventListener('touchstart', onTouchStart, { passive: true, capture: true });
				window.addEventListener('touchmove', onTouchMove, { passive: false, capture: true });
				window.addEventListener('touchend', onTouchEnd, { passive: true, capture: true });
				window.addEventListener('touchcancel', onTouchEnd, { passive: true, capture: true });
			})();
		</script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div id="boot-splash" aria-hidden="true">
			<img class="splash-light" src="%sveltekit.assets%/brand/logo-horizontal-blue.svg" alt="" />
			<img class="splash-dark" src="%sveltekit.assets%/brand/logo-horizontal-white.svg" alt="" />
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
