name: Docker Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build on PRs too so Dockerfile / pnpm / build regressions surface
  # pre-merge. PR runs build the image but never push (gated below).
  pull_request:
  # Ghost publish → rebuild (docs/ghost.md). A relay turns Ghost's post webhooks
  # into `POST /repos/nycu-life/landing/dispatches {"event_type":"ghost-publish"}`;
  # the run rebuilds and pushes :latest with fresh comics from Ghost.
  repository_dispatch:
    types: [ghost-publish]
  workflow_dispatch:

# Bursts of Ghost edits each send a dispatch; only the newest content rebuild
# matters, so supersede queued ones. Code builds keep one group per run.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && 'ghost-publish' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'repository_dispatch' }}

# Registry host comes from the HARBOR_REGISTRY secret (falls back to the known
# host for fork PRs where secrets are unavailable). The image lives in the
# dedicated `landing` Harbor project (matches the per-product project layout,
# e.g. nycu-bus / coz-planner). The k8s deployment pulls landing/web.
env:
  REGISTRY: ${{ secrets.HARBOR_REGISTRY || 'harbor.nycu.one' }}
  IMAGE_PATH: landing/web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Push only on push/tag events to the canonical repo AND only when Harbor
      # credentials are configured. PRs (incl. forks) verify the build without
      # pushing, and main stays green even before the secrets are added.
      - id: guard
        run: echo "push=${{ github.event_name != 'pull_request' && secrets.HARBOR_USERNAME != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: steps.guard.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.guard.outputs.push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Comics are prerendered from Ghost (docs/ghost.md). GHOST_URL is a repo
          # variable; the Content API key is a BuildKit secret, never a build arg,
          # so it stays out of image layers, history and the GHA cache. Pushed
          # images must carry real Ghost content (GHOST_REQUIRED=1 fails the build
          # rather than shipping placeholders); PR builds may fall back.
          build-args: |
            PUBLIC_GA_ID=${{ vars.PUBLIC_GA_ID }}
            GHOST_URL=${{ vars.GHOST_URL }}
            GHOST_REQUIRED=${{ steps.guard.outputs.push == 'true' && vars.GHOST_URL != '' && '1' || '' }}
            CONTENT_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            ghost_content_api_key=${{ secrets.GHOST_CONTENT_API_KEY }}

  build-and-push-wish-api:
    # Content-only rebuilds (Ghost publish) don't touch the Wish API.
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: guard
        run: echo "push=${{ github.event_name != 'pull_request' && secrets.HARBOR_USERNAME != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: steps.guard.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/landing/wish-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ steps.guard.outputs.push == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wish-api
          cache-to: type=gha,mode=max,scope=wish-api
