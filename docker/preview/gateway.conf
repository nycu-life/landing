# Local stand-in for the production Traefik routing: /api/wishes goes to the Go
# Wish API, everything else to the static nginx site container.
server {
	listen 8080;
	server_name _;
	absolute_redirect off;

	location ^~ /api/wishes {
		proxy_pass http://wish-api:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_set_header X-Forwarded-Host $http_host;
		# Server-Sent Events: never buffer, keep the stream open.
		proxy_buffering off;
		proxy_read_timeout 1h;
	}

	location / {
		proxy_pass http://web:3000;
		proxy_set_header Host $http_host;
	}
}
