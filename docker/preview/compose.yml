# Full local preview: static site + Wish API + Postgres behind one gateway that
# mimics the production Traefik split. Ghost (comics source) is included from
# docker/ghost/compose.yml when present; see docs/preview.md.
#
#   docker compose -f docker/preview/compose.yml --env-file docker/preview/.env up -d --build
name: landing-preview

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wishes
      POSTGRES_USER: wishes
      POSTGRES_PASSWORD: wishes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wishes']
      interval: 5s
      timeout: 3s
      retries: 20

  wish-migrate:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    command: ['migrate']
    environment:
      DATABASE_URL: postgres://wishes:wishes@postgres:5432/wishes?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  wish-api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://wishes:wishes@postgres:5432/wishes?sslmode=disable
      WISH_COOKIE_SECRET: ${WISH_COOKIE_SECRET:?set in docker/preview/.env}
      WISH_ADMIN_TOKEN: ${WISH_ADMIN_TOKEN:?set in docker/preview/.env}
      WISH_SERVICE_CLIENTS: ${WISH_SERVICE_CLIENTS:-}
      WISH_OIDC_ISSUER: ${WISH_OIDC_ISSUER:-}
      WISH_OIDC_CLIENT_ID: ${WISH_OIDC_CLIENT_ID:-}
      WISH_OIDC_REDIRECT_URL: ${WISH_OIDC_REDIRECT_URL:-}
    depends_on:
      wish-migrate:
        condition: service_completed_successfully

  web:
    # Built by docker/preview/up.sh: the prerender needs host networking to reach
    # Ghost, which compose's bake builder only allows with extra entitlements.
    image: landing-preview-web:latest

  gateway:
    image: nginx:1.30.6-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${PREVIEW_PORT:-18090}:8080'
    depends_on:
      - web
      - wish-api

volumes:
  pgdata:
