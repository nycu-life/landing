server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Behind a proxy/Ingress the public port differs from this listen port, so
	# emit relative redirects (e.g. the trailing-slash redirect for clean URLs)
	# instead of baking in http://host:3000/.
	absolute_redirect off;

	# Long-cache the content-hashed immutable assets emitted by SvelteKit.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# The site is fully prerendered (each route → <route>/index.html). Resolve
	# the directory index for clean URLs and fall back to the home page.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
