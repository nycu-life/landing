server {
	listen 3000;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Behind a proxy/Ingress the public port differs from this listen port, so
	# emit relative redirects (e.g. the trailing-slash redirect for clean URLs)
	# instead of baking in http://host:3000/.
	absolute_redirect off;

	# Long-cache the content-hashed immutable assets emitted by SvelteKit.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# API traffic is routed to the separate Wish API service by Traefik. Fail
	# closed here so a missing ingress rule cannot disguise itself as index.html.
	# A literal body bypasses the HTML error_page below.
	location ^~ /api/ {
		default_type application/json;
		return 404 '{"error":"not_found"}';
	}

	# Unknown and withdrawn URLs answer with their real status and the SvelteKit
	# error shell (adapter-static `fallback`), which is noindex and has no
	# canonical. Requesting the shell directly is a plain 404 too.
	error_page 404 410 /404.html;

	location = /404.html {
		internal;
	}

	# These unfinished destination pages are temporarily withdrawn. Return an
	# explicit gone response instead of allowing the SPA fallback to serve the
	# homepage at retired URLs, which would keep them indexable as duplicates.
	location ~ ^/(about|courses|products|devlog)/?$ {
		return 410;
	}

	location = /team {
		return 410;
	}

	location ^~ /team/ {
		return 410;
	}

	# The site is fully prerendered (each route → <route>/index.html). Resolve
	# the directory index for clean URLs; anything else is a real 404 rather than
	# a soft-404 copy of the home page.
	location / {
		try_files $uri $uri/ =404;
	}
}
