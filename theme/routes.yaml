routes:
  /:
    template: home
    data: page.theme-zh-tw-hero
  /en/:
    template: home-en
    data: page.theme-en-hero
  /about/:
    template: about
    data: page.theme-zh-tw-about
  /en/about/:
    template: about-en
    data: page.theme-en-about
  /products/:
    template: products
  /en/products/:
    template: products-en
  /wishpool/:
    template: page
    data: page.theme-wishpool

collections:
  /comics/:
    permalink: /comics/{slug}/
    template: comics
    filter: 'tag:[hash-comics,comics]'
  /devlog/:
    permalink: /devlog/{slug}/
    template: index
    filter: 'tag:[hash-devlog,devlog]+tag:-[hash-comics,comics]'
  /news/:
    permalink: /news/{slug}/
    template: news
    filter: 'tag:-[hash-devlog,devlog,hash-comics,comics]'

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
